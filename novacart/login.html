<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NovaCart</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--color-bg);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--color-text-primary);
            padding: 2rem 1rem;
            position: relative;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto;
        }

        /* Minimal Centered Card */
        .auth-card {
            background-color: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02), 0 12px 24px -4px rgba(15, 23, 42, 0.06);
            width: 100%;
            padding: 2.5rem 2.25rem;
            position: relative;
            z-index: 1;
            transition: all var(--transition-normal);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 2rem 1.5rem;
                border-radius: 14px;
            }
        }

        /* Clean Centered Header */
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--color-text-primary);
            text-decoration: none;
            margin-bottom: 0.85rem;
            letter-spacing: -0.02em;
        }

        .auth-brand span {
            color: var(--color-primary);
        }

        .auth-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 0.35rem;
            letter-spacing: -0.01em;
        }

        .auth-subtitle {
            color: var(--color-text-secondary);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Form Controls */
        .auth-form .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.45rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--color-text-primary);
            background-color: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            outline: none;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .form-control:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-input-group {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-secondary);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 0.25rem;
            transition: color var(--transition-fast);
        }

        .password-toggle:hover {
            color: var(--color-text-primary);
        }

        /* Options Row */
        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.75rem;
            font-size: 0.88rem;
        }

        .remember-me {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .remember-me input {
            accent-color: var(--color-primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--color-primary);
            font-weight: 600;
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Buttons */
        .btn-auth-primary {
            width: 100%;
            padding: 0.85rem 1.25rem;
            font-size: 0.98rem;
            font-weight: 600;
            font-family: inherit;
            color: #FFFFFF;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
            transition: all var(--transition-fast);
        }

        .btn-auth-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.28);
        }

        .btn-auth-primary:active {
            transform: translateY(0);
        }

        .btn-auth-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--color-text-muted);
            margin: 1.5rem 0;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--color-border);
        }

        .auth-divider span {
            padding: 0 0.85rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--color-text-secondary);
        }

        /* Google Button */
        .btn-google {
            width: 100%;
            padding: 0.8rem 1.25rem;
            font-size: 0.92rem;
            font-weight: 600;
            font-family: inherit;
            color: var(--color-text-primary);
            background-color: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all var(--transition-fast);
        }

        .btn-google:hover {
            background-color: var(--color-card-subtle);
            border-color: #CBD5E1;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* Footer Link inside Card */
        .auth-card-footer {
            text-align: center;
            margin-top: 1.75rem;
            color: var(--color-text-secondary);
            font-size: 0.9rem;
        }

        .auth-card-footer a {
            color: var(--color-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-card-footer a:hover {
            text-decoration: underline;
        }

        /* Minimal Page Footer */
        .auth-page-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        .auth-page-footer a {
            color: var(--color-text-secondary);
            text-decoration: none;
            margin: 0 0.4rem;
        }

        .auth-page-footer a:hover {
            color: var(--color-primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <!-- Main Centered Login Card -->
        <div class="auth-card animate-slide-up">
            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <i class="fas fa-shopping-bag" style="color: var(--color-primary);"></i> Nova<span>Cart</span>
                </a>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Enter your credentials to access your account</p>
            </div>

            <form class="auth-form" onsubmit="event.preventDefault(); handleLogin();">
                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <input type="email" id="email" class="form-control" required placeholder="you@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-input-group">
                        <input type="password" id="password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
                        <i class="fas fa-eye password-toggle" id="togglePassword" title="Show password"></i>
                    </div>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" class="forgot-password" onclick="handleForgotPassword(event)">Forgot password?</a>
                </div>

                <button type="submit" class="btn-auth-primary" id="loginBtn">
                    Sign In <i class="fas fa-arrow-right" style="font-size: 0.85rem;"></i>
                </button>
            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <button class="btn-google" type="button" onclick="loginWithGoogle()">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Continue with Google
            </button>

            <div class="auth-card-footer">
                Don't have an account? <a href="register.html">Sign up</a>
            </div>
        </div>

        <!-- Minimal Page Copyright Footer -->
        <div class="auth-page-footer">
            <p>© 2026 NovaCart, Inc. All rights reserved.</p>
            <p style="margin-top: 0.35rem;">
                <a href="#">Privacy Policy</a> • <a href="#">Terms of Service</a> • <a href="#">Help Center</a>
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/app.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (user) {
                window.location.href = 'index.html';
            }

            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');

            togglePassword.addEventListener('click', function (e) {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.classList.toggle('fa-eye-slash');
            });
        });

        async function handleLogin() {
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            const email = emailInput ? emailInput.value : '';
            const pass = passInput ? passInput.value : '';
            const btn = document.getElementById('loginBtn');
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            btn.disabled = true;

            try {
                const success = await login(email, pass);
                if(!success) {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error("Login submission error:", err);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function handleForgotPassword(e) {
            e.preventDefault();
            let email = document.getElementById('email').value;
            if (!email) {
                email = prompt("Please enter your email address to reset your password:");
            }
            
            if (email) {
                resetPassword(email);
            }
        }
    </script>
    <button id="backToTop" class="btn-icon" title="Back to Top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" style="position: fixed; bottom: 2rem; right: 2rem; z-index: 99; display: none; background: var(--color-primary); color: white; box-shadow: var(--shadow-lg);">
        <i class="fas fa-arrow-up"></i>
    </button>
</body>
</html>
