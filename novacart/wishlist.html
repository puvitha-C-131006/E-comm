<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Saved Wishlist | NovaCart</title>
    <meta name="description" content="View and manage your saved wishlist items on NovaCart.">
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .empty-wishlist {
            text-align: center;
            padding: 5rem 1rem;
            background-color: var(--color-card-bg);
            border-radius: var(--radius-xl);
            border: 1px solid var(--color-border);
        }

        .empty-wishlist i {
            font-size: 4rem;
            color: var(--color-border);
            margin-bottom: 1.5rem;
        }

        .empty-wishlist h2 {
            font-size: 1.5rem;
            color: var(--color-text-primary);
            margin-bottom: 0.5rem;
        }

        .empty-wishlist p {
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <!-- Desktop & Mobile Sticky Navigation Header -->
    <header class="navbar">
        <div class="container">
            <!-- Brand Logo -->
            <a href="index.html" class="logo" id="brandLogo">
                <div class="logo-badge">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                Nova<span>Cart</span>
            </a>

            <!-- Location Selector Pill -->
            <div class="location-pill" onclick="openLocationModal()" title="Change Delivery Location">
                <i class="fas fa-map-marker-alt"></i>
                <div class="loc-text">
                    <span class="sub">Deliver to</span>
                    <span class="main"><span class="loc-city-name">Bengaluru</span> <span class="loc-pincode" style="font-weight:500; font-size:0.75rem;">560001</span></span>
                </div>
            </div>
            
            <!-- Global Unified Search with Category Selector -->
            <div class="search-wrapper">
                <div class="search-bar-unified">
                    <select class="search-category-select" id="searchCategorySelect">
                        <option value="all">All Departments</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Footwear">Footwear</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Home Appliances">Home & Living</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                    <input type="text" id="globalSearchInput" placeholder="Search brands, products, laptops, sneakers..." autocomplete="off">
                    <button class="search-btn" title="Search"><i class="fas fa-search"></i></button>
                </div>
                <div class="search-suggestions-dropdown" id="searchSuggestions"></div>
            </div>

            <!-- Navigation Menu -->
            <nav class="nav-menu">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Shop</a></li>
                    <li><a href="products.html?deals=true"><i class="fas fa-bolt" style="color: var(--color-warning); font-size: 0.85rem;"></i> Deals</a></li>
                </ul>
                
                <!-- Nav Actions -->
                <div class="nav-actions">
                    <!-- Theme Toggle -->
                    <button id="theme-toggle" class="action-icon" title="Toggle Dark/Light Mode" onclick="toggleTheme()">
                        <i class="fas fa-moon"></i>
                    </button>

                    <!-- User Account / Profile -->
                    <a href="login.html" class="btn btn-primary auth-link" style="font-size: 0.85rem; padding: 0.45rem 1rem;">Login</a>
                    
                    <a href="profile.html" class="profile-link user-profile-chip active" title="Account">
                        <div class="user-avatar"><i class="far fa-user"></i></div>
                        <span class="user-name">Account</span>
                    </a>

                    <!-- Wishlist Link -->
                    <a href="wishlist.html" class="action-icon wishlist-action" title="Wishlist" style="color: var(--color-danger);">
                        <i class="fas fa-heart"></i>
                        <span class="badge wishlist-badge" style="display: none;">0</span>
                    </a>
                    
                    <!-- Cart Link (Triggers Slide-Out Drawer) -->
                    <a href="javascript:void(0)" onclick="openCartDrawer()" class="action-icon cart-drawer-trigger" title="Cart">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge cart-badge" style="display: none;">0</span>
                    </a>
                </div>
            </nav>

            <button class="mobile-toggle" aria-label="Open Navigation Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Main Wishlist Profile Content Area -->
    <main class="profile-page-wrapper">
        <div class="container">
            
            <!-- Profile 2-Column Responsive Layout -->
            <div class="profile-layout">
                
                <!-- Left Sidebar Navigation -->
                <aside class="profile-sidebar">
                    <div class="profile-user-card">
                        <div class="profile-avatar-lg" id="profileAvatarLg">P</div>
                        <div class="profile-display-name" id="profileDisplayName">Puvitha C</div>
                        <div class="profile-display-email" id="profileDisplayEmail">puvitha.c@example.com</div>
                        <span class="profile-badge-pill"><i class="fas fa-check-circle"></i> Verified Buyer</span>
                    </div>

                    <nav class="profile-nav-menu">
                        <a href="profile.html" class="profile-nav-item">
                            <i class="fas fa-chart-pie"></i> Dashboard Overview
                        </a>
                        <a href="profile.html#personal" class="profile-nav-item">
                            <i class="far fa-user"></i> Personal Information
                        </a>
                        <a href="profile.html#address" class="profile-nav-item">
                            <i class="fas fa-map-marked-alt"></i> Address Book
                        </a>
                        <a href="orders.html" class="profile-nav-item">
                            <i class="fas fa-box-open"></i> My Orders
                        </a>
                        <a href="wishlist.html" class="profile-nav-item active">
                            <i class="far fa-heart"></i> Saved Wishlist
                        </a>
                        <div class="profile-nav-item profile-nav-logout" onclick="handleLogout()">
                            <i class="fas fa-sign-out-alt"></i> Sign Out
                        </div>
                    </nav>
                </aside>

                <!-- Right Main Content Area: Wishlist -->
                <div>
                    <!-- Wishlist Header Card -->
                    <div class="profile-card" style="margin-bottom: 2rem;">
                        <div class="profile-card-header" style="border-bottom: none; padding-bottom: 0; margin-bottom: 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                            <div class="profile-card-title">
                                <i class="far fa-heart" style="color: var(--color-danger);"></i> Saved Wishlist Items
                            </div>
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <a href="products.html?from=wishlist" class="btn btn-outline" style="font-size: 0.82rem; padding: 0.35rem 0.85rem; border-radius: var(--radius-md); text-decoration: none;">
                                    <i class="fas fa-plus"></i> Explore More Products
                                </a>
                                <span id="wishlistCount" style="background: var(--color-card-subtle); padding: 0.35rem 0.85rem; border-radius: var(--radius-full); font-size: 0.82rem; font-weight: 700; border: 1px solid var(--color-border); color: var(--color-text-secondary);">
                                    0 Items
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Populated via JS -->
                    <div class="product-grid" id="wishlistGrid">
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="assets/js/products.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/cart.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let user = getCurrentUser();
            if (!user && typeof firebase !== 'undefined' && firebase.auth) {
                user = firebase.auth().currentUser;
            }
            if (!user) {
                user = createMockUserSession('puvitha.c@example.com', 'Puvitha C');
            }
            hydrateProfileSidebar(user);
            await fetchProducts();
            renderWishlistPage();
        });

        function hydrateProfileSidebar(user) {
            if (!user) return;
            const name = user.displayName || 'Puvitha C';
            const email = user.email || 'puvitha.c@example.com';
            const initial = name.charAt(0).toUpperCase() || 'P';

            const avatarEl = document.getElementById('profileAvatarLg');
            const nameEl = document.getElementById('profileDisplayName');
            const emailEl = document.getElementById('profileDisplayEmail');

            if (avatarEl) avatarEl.textContent = initial;
            if (nameEl) nameEl.textContent = name;
            if (emailEl) emailEl.textContent = email;
        }

        async function renderWishlistPage() {
            const grid = document.getElementById('wishlistGrid');
            const countSpan = document.getElementById('wishlistCount');
            const wishlistItems = await getWishlistData();
            
            if (countSpan) {
                countSpan.textContent = `${wishlistItems.length} Item${wishlistItems.length !== 1 ? 's' : ''} Saved`;
            }

            if (wishlistItems.length === 0) {
                grid.style.display = 'block';
                grid.innerHTML = `
                    <div class="empty-wishlist animate-fade-in">
                        <i class="far fa-heart"></i>
                        <h2>No Items In Wishlist</h2>
                        <p>Save items you love to your wishlist to buy them later.</p>
                        <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
                            <a href="profile.html" class="btn btn-outline"><i class="fas fa-user"></i> Go to Profile</a>
                            <a href="products.html?from=wishlist" class="btn btn-primary"><i class="fas fa-shopping-bag"></i> Discover Products</a>
                        </div>
                    </div>
                `;
                return;
            }

            grid.style.display = 'grid';

            grid.innerHTML = wishlistItems.map(id => {
                const product = products.find(p => p.id === id);
                if (!product) return '';

                const discountedPrice = calculateDiscount(product.price, product.discount);
                const hasDiscount = product.discount > 0;
                
                return `
                <div class="product-card animate-fade-in">
                    <div class="product-badges">
                        ${hasDiscount ? `<span class="product-badge badge-discount">-${product.discount}%</span>` : ''}
                    </div>
                    
                    <div class="product-actions">
                        <button class="btn-icon" onclick="removeFromWishlistPage(${product.id})" title="Remove from Wishlist">
                            <i class="fas fa-trash" style="color: var(--color-text-secondary);"></i>
                        </button>
                    </div>

                    <div class="product-image-container" style="cursor:pointer;" onclick="window.location.href='product-details.html?id=${product.id}'">
                        <img src="${product.image}" alt="${product.name}" class="product-image" loading="lazy" onerror="this.onerror=null; this.src='assets/images/product-default.png';">
                    </div>

                    <div class="product-info">
                        <div class="product-category">${product.category} &bull; ${product.brand}</div>
                        <h3 class="product-title" style="cursor:pointer;" onclick="window.location.href='product-details.html?id=${product.id}'">${product.name}</h3>
                        
                        <div class="product-price">
                            <span class="current-price">${formatPrice(discountedPrice)}</span>
                            ${hasDiscount ? `<span class="old-price">${formatPrice(product.price)}</span>` : ''}
                        </div>

                        <button class="btn btn-primary" style="width: 100%;" onclick="addToCart(${product.id})">
                            <i class="fas fa-cart-plus"></i> Add to Cart
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function removeFromWishlistPage(productId) {
            await toggleWishlist(productId);
            renderWishlistPage();
        }

        function handleLogout() {
            if (typeof logout === 'function') {
                logout();
            } else {
                localStorage.removeItem('novacart_mock_user');
                window.location.href = 'index.html';
            }
        }
    </script>
    <button id="backToTop" class="btn-icon" title="Back to Top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" style="position: fixed; bottom: 2rem; right: 2rem; z-index: 99; display: none; background: var(--color-primary); color: white; box-shadow: var(--shadow-lg);">
        <i class="fas fa-arrow-up"></i>
    </button>
</body>
</html>
